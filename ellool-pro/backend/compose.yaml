services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    # Keep the model server private to the Docker network.
    expose:
      - "11434"

  model-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    restart: "no"
    entrypoint: ["/bin/sh", "-lc"]
    command: ["until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do sleep 2; done; OLLAMA_HOST=http://ollama:11434 ollama pull qwen2.5:3b"]
    
  api:
    build: .
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
      model-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      COOKIE_SECURE: "true"
    volumes:
      - ellool_data:/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  ollama_data:
  ellool_data:
